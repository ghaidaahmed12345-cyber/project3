<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Graphic designer studio flatlay with sketchbook and colour palette">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E9DF"/>
      <stop offset=".55" stop-color="#EEE1D5"/>
      <stop offset="1" stop-color="#E3D1C2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF6"/>
      <stop offset="1" stop-color="#F6ECDF"/>
    </linearGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2C33"/>
      <stop offset="1" stop-color="#21191E"/>
    </linearGradient>
    <radialGradient id="light" cx=".7" cy=".1" r=".9">
      <stop offset="0" stop-color="#FFFAF3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFAF3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#4A3546" flood-opacity=".2"/>
    </filter>
    <filter id="shadowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4A3546" flood-opacity=".15"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
    </filter>
    <pattern id="linen" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0 H7 M0 0 V7" stroke="#CBB5A3" stroke-width=".5" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#linen)" opacity=".7"/>
  <rect width="1000" height="1250" fill="url(#light)"/>

  <!-- sketchbook -->
  <g transform="rotate(-5 380 360)" filter="url(#shadow)">
    <rect x="80" y="100" width="600" height="520" rx="4" fill="url(#paper)"/>
    <rect x="102" y="122" width="556" height="476" rx="2" fill="none" stroke="#E2D2C1" stroke-width=".8"/>
    <path d="M380 100 v 520" stroke="#E7D9C9" stroke-width="1.2" opacity=".8"/>
    <!-- sketches -->
    <path d="M160 500 V 330 a 90 90 0 0 1 180 0 V 500 Z" fill="none" stroke="#B08FA5" stroke-width="1.6"/>
    <circle cx="250" cy="330" r="42" fill="none" stroke="#B08FA5" stroke-width="1.2"/>
    <path d="M160 500 h180" stroke="#C0A06A" stroke-width="1"/>
    <g stroke="#D3C0B0" stroke-width="1.2" stroke-linecap="round">
      <path d="M400 260 h200 M400 288 h160 M400 316 h180 M400 344 h120"/>
    </g>
    <circle cx="440" cy="430" r="26" fill="#EFD8D3"/>
    <circle cx="500" cy="430" r="26" fill="#D9AFAE"/>
    <circle cx="560" cy="430" r="26" fill="#B08FA5"/>
    <circle cx="620" cy="430" r="26" fill="#6E5266"/>
    <text x="400" y="520" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#8C6F84">ideas &amp; ink</text>
    <path d="M400 536 h96" stroke="#C0A06A" stroke-width="1"/>
  </g>

  <!-- coffee -->
  <g filter="url(#shadowSoft)">
    <circle cx="822" cy="246" r="96" fill="#F9F1E7"/>
    <circle cx="822" cy="246" r="96" fill="none" stroke="#E2D0C0" stroke-width="1"/>
    <circle cx="822" cy="246" r="66" fill="#FDF8F1"/>
    <circle cx="822" cy="246" r="54" fill="#8A6252"/>
    <circle cx="822" cy="246" r="54" fill="none" stroke="#6E4A3D" stroke-width="1.4" opacity=".5"/>
    <path d="M888 222 a 26 26 0 0 1 0 48" fill="none" stroke="#E2D0C0" stroke-width="9"/>
    <path d="M800 210 c -10 -12 10 -18 0 -30 M830 204 c -10 -12 10 -18 0 -30" stroke="#F3E4D6" stroke-width="2" fill="none" opacity=".7"/>
  </g>

  <!-- pampas -->
  <g transform="translate(910 30)" opacity=".85">
    <path d="M20 420 C 10 250 0 150 -20 40" stroke="#B49A85" stroke-width="2" fill="none"/>
    <g fill="#E6D3C2" opacity=".9">
      <ellipse cx="-14" cy="80" rx="10" ry="34" transform="rotate(-12 -14 80)"/>
      <ellipse cx="4" cy="100" rx="10" ry="38" transform="rotate(8 4 100)"/>
      <ellipse cx="-26" cy="130" rx="9" ry="34" transform="rotate(-20 -26 130)"/>
      <ellipse cx="12" cy="160" rx="9" ry="32" transform="rotate(14 12 160)"/>
      <ellipse cx="-18" cy="190" rx="8" ry="30" transform="rotate(-8 -18 190)"/>
      <ellipse cx="6" cy="220" rx="8" ry="28" transform="rotate(10 6 220)"/>
    </g>
  </g>

  <!-- colour palette -->
  <g transform="rotate(4 280 830)" filter="url(#shadow)">
    <rect x="90" y="690" width="370" height="280" rx="10" fill="#FBF5EC"/>
    <rect x="108" y="708" width="334" height="244" rx="6" fill="none" stroke="#E4D3C1" stroke-width=".8"/>
    <text x="128" y="742" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" letter-spacing="4" fill="#A1907F">PALETTE 01</text>
    <g>
      <circle cx="160" cy="800" r="30" fill="#F3DEDA"/>
      <circle cx="240" cy="800" r="30" fill="#D9AFAE"/>
      <circle cx="320" cy="800" r="30" fill="#B08FA5"/>
      <circle cx="400" cy="800" r="30" fill="#6E5266"/>
      <circle cx="200" cy="880" r="30" fill="#C0A06A"/>
      <circle cx="280" cy="880" r="30" fill="#EFE3D7"/>
      <circle cx="360" cy="880" r="30" fill="#2A2126"/>
    </g>
    <text x="128" y="942" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8C6F84">blush · mauve · cream · gold</text>
  </g>

  <!-- tablet -->
  <g transform="rotate(-3 720 880)" filter="url(#shadow)">
    <rect x="520" y="700" width="410" height="340" rx="20" fill="url(#tablet)"/>
    <rect x="538" y="718" width="374" height="304" rx="12" fill="#FBF5EC"/>
    <g stroke="#E6D8C8" stroke-width=".8">
      <path d="M600 718 V 1022 M676 718 V 1022 M752 718 V 1022 M828 718 V 1022"/>
      <path d="M538 790 H 912 M538 862 H 912 M538 934 H 912"/>
    </g>
    <path d="M560 830 V 780 a 34 34 0 0 1 68 0 V 830 Z" fill="#D9AFAE"/>
    <circle cx="700" cy="800" r="20" fill="#B08FA5"/>
    <rect x="752" y="768" width="120" height="46" rx="4" fill="#8C6F84"/>
    <text x="812" y="796" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#FBF4EC">layout</text>
    <rect x="560" y="880" width="200" height="4" rx="2" fill="#DCCAC1"/>
    <rect x="560" y="896" width="150" height="4" rx="2" fill="#DCCAC1"/>
    <rect x="560" y="946" width="90" height="30" rx="15" fill="#2A2126"/>
    <circle cx="900" cy="990" r="18" fill="none" stroke="#C0A06A" stroke-width="1.2"/>
  </g>

  <!-- pencil -->
  <g transform="rotate(-38 470 660)" filter="url(#shadowSoft)">
    <rect x="450" y="470" width="16" height="300" rx="8" fill="#B08FA5"/>
    <path d="M450 770 h16 l -8 38 Z" fill="#E8D3C2"/>
    <path d="M455 796 h6 l -3 12 Z" fill="#2A2126"/>
    <rect x="450" y="490" width="16" height="24" fill="#C0A06A"/>
  </g>

  <!-- paper clips -->
  <g stroke="#C0A06A" fill="none" stroke-width="3" opacity=".85" transform="rotate(12 880 640)">
    <path d="M860 600 v 60 a 18 18 0 0 0 36 0 v -70 a 11 11 0 0 0 -22 0 v 62"/>
  </g>

  <rect width="1000" height="1250" filter="url(#grain)" opacity=".15"/>
</svg>
