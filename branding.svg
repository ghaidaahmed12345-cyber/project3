<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Luxury brand identity stationery mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E9E0"/>
      <stop offset=".55" stop-color="#EFDFD5"/>
      <stop offset="1" stop-color="#E4CDC4"/>
    </linearGradient>
    <radialGradient id="light" cx=".68" cy=".12" r=".85">
      <stop offset="0" stop-color="#FFFAF2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFAF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F6EEE4"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EED8D3"/>
      <stop offset="1" stop-color="#E0C2BE"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#4A3546" flood-opacity=".20"/>
    </filter>
    <filter id="shadowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3546" flood-opacity=".14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#light)"/>
  <circle cx="1040" cy="220" r="300" fill="#D8B0B8" opacity=".38" filter="url(#blur)"/>
  <circle cx="120" cy="1320" r="280" fill="#B08FA5" opacity=".22" filter="url(#blur)"/>

  <!-- botanical sprig -->
  <g stroke="#8C6F84" fill="none" opacity=".45" stroke-linecap="round">
    <path d="M1110 1460 C1080 1300 1050 1170 1000 1060" stroke-width="3"/>
    <path d="M1060 1300 c-40 -18 -70 -10 -90 12" stroke-width="2"/>
    <path d="M1075 1240 c40 -22 76 -16 96 6" stroke-width="2"/>
    <path d="M1045 1180 c-38 -14 -64 -4 -80 16" stroke-width="2"/>
    <path d="M1030 1130 c34 -18 64 -12 82 8" stroke-width="2"/>
  </g>

  <!-- envelope (back) -->
  <g transform="rotate(6 820 1000)" filter="url(#shadow)">
    <rect x="575" y="830" width="490" height="330" rx="5" fill="url(#envelope)"/>
    <path d="M575 836 L820 1010 L1065 836" fill="none" stroke="#CFAEAA" stroke-width="2.5"/>
    <path d="M575 1155 L790 985" fill="none" stroke="#CFAEAA" stroke-width="2.5"/>
    <path d="M1065 1155 L850 985" fill="none" stroke="#CFAEAA" stroke-width="2.5"/>
    <circle cx="820" cy="1010" r="46" fill="#A9869B"/>
    <circle cx="820" cy="1010" r="35" fill="none" stroke="#F3E5DC" stroke-width="1.2" opacity=".8"/>
    <text x="820" y="1022" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#F8EFE7">CT</text>
  </g>

  <!-- letterhead -->
  <g transform="rotate(-5 440 620)" filter="url(#shadow)">
    <rect x="180" y="190" width="520" height="760" rx="3" fill="url(#paper)"/>
    <text x="230" y="330" font-family="Georgia, serif" font-size="46" letter-spacing="10" fill="#2A2126">CT</text>
    <rect x="232" y="352" width="120" height="1.5" fill="#C0A06A"/>
    <text x="230" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="7" fill="#8C6F84">BRAND IDENTITY</text>
    <text x="228" y="558" font-family="Georgia, serif" font-size="86" font-style="italic" fill="#2A2126">Aurelia</text>
    <text x="232" y="600" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="5" fill="#9C8B80">SKINCARE · RITUALS · BOTANICALS</text>
    <g fill="#E4D5CC">
      <rect x="232" y="690" width="330" height="3" rx="1.5"/>
      <rect x="232" y="714" width="286" height="3" rx="1.5"/>
      <rect x="232" y="738" width="310" height="3" rx="1.5"/>
      <rect x="232" y="762" width="240" height="3" rx="1.5"/>
    </g>
    <path d="M232 850 h300" stroke="#DCC9BE" stroke-width="1.2"/>
    <text x="232" y="884" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#A1907F">HELLO@AURELIA.STUDIO</text>
  </g>

  <!-- swatch fan -->
  <g filter="url(#shadowSoft)">
    <g transform="rotate(-14 790 1290)">
      <rect x="770" y="1225" width="58" height="150" rx="8" fill="#F6E5E1"/>
    </g>
    <g transform="rotate(-7 838 1290)">
      <rect x="820" y="1210" width="58" height="165" rx="8" fill="#D9AFAE"/>
    </g>
    <g transform="rotate(0 886 1290)">
      <rect x="870" y="1200" width="58" height="175" rx="8" fill="#B08FA5"/>
    </g>
    <g transform="rotate(7 934 1290)">
      <rect x="920" y="1210" width="58" height="165" rx="8" fill="#6E5266"/>
    </g>
    <g transform="rotate(14 982 1290)">
      <rect x="970" y="1225" width="58" height="150" rx="8" fill="#C0A06A"/>
    </g>
  </g>

  <!-- dark business card -->
  <g transform="rotate(-11 330 1170)" filter="url(#shadow)">
    <rect x="120" y="1035" width="420" height="255" rx="10" fill="#2A2126"/>
    <rect x="140" y="1055" width="380" height="215" rx="6" fill="none" stroke="#C0A06A" stroke-width=".8" opacity=".55"/>
    <text x="168" y="1145" font-family="Georgia, serif" font-size="62" letter-spacing="6" fill="#C9A96F">CT</text>
    <text x="170" y="1196" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#E9DDD3">CREATIVE TOUCH</text>
    <text x="170" y="1222" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#A9928A">GRAPHIC DESIGNER</text>
  </g>

  <!-- cream business card -->
  <g transform="rotate(9 640 1210)" filter="url(#shadowSoft)">
    <rect x="470" y="1090" width="400" height="240" rx="10" fill="#FBF6EE"/>
    <text x="505" y="1150" font-family="Georgia, serif" font-size="30" fill="#2A2126">Layla Hassan</text>
    <rect x="505" y="1168" width="60" height="1.5" fill="#C0A06A"/>
    <g fill="#CFBDB2">
      <rect x="505" y="1200" width="190" height="2.5" rx="1"/>
      <rect x="505" y="1218" width="150" height="2.5" rx="1"/>
      <rect x="505" y="1236" width="170" height="2.5" rx="1"/>
    </g>
    <circle cx="810" cy="1270" r="26" fill="none" stroke="#D9AFAE" stroke-width="1.4"/>
    <text x="810" y="1277" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8C6F84">CT</text>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".16"/>
</svg>
