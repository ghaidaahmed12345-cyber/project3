<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Website design mockup on desktop and phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFDCD8"/>
      <stop offset=".5" stop-color="#DFC2C7"/>
      <stop offset="1" stop-color="#B08FA5"/>
    </linearGradient>
    <radialGradient id="light" cx=".3" cy=".15" r=".9">
      <stop offset="0" stop-color="#FFF8F1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFF8F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF8F2"/>
      <stop offset="1" stop-color="#F6ECE2"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CFCA"/>
      <stop offset="1" stop-color="#D2AEB6"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33262E"/>
      <stop offset="1" stop-color="#1E171C"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#3E2A36" flood-opacity=".3"/>
    </filter>
    <filter id="shadowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3E2A36" flood-opacity=".22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#light)"/>
  <circle cx="1350" cy="180" r="330" fill="#F7E9E2" opacity=".4" filter="url(#blur)"/>
  <circle cx="180" cy="960" r="300" fill="#6E5266" opacity=".2" filter="url(#blur)"/>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="130" y="180" width="1120" height="740" rx="18" fill="url(#screen)"/>
    <path d="M130 198 a18 18 0 0 1 18 -18 h1084 a18 18 0 0 1 18 18 v 50 H130 Z" fill="#EFE3D9"/>
    <circle cx="170" cy="214" r="6" fill="#D9AFAE"/>
    <circle cx="192" cy="214" r="6" fill="#E7C9A8"/>
    <circle cx="214" cy="214" r="6" fill="#B9C4B0"/>
    <rect x="640" y="202" width="300" height="24" rx="12" fill="#FBF6EF"/>
    <text x="790" y="219" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#A1907F">creativetouch.studio</text>

    <!-- site nav -->
    <text x="176" y="318" font-family="Georgia, serif" font-size="24" letter-spacing="1" fill="#2A2126">creative touch</text>
    <g font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#6F625C">
      <text x="890" y="315">WORK</text>
      <text x="960" y="315">ABOUT</text>
      <text x="1035" y="315">CONTACT</text>
    </g>
    <rect x="1110" y="298" width="94" height="28" rx="14" fill="#2A2126"/>
    <text x="1157" y="316" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" letter-spacing="1" fill="#F7EDE5">LET'S TALK</text>

    <!-- hero copy -->
    <text x="176" y="450" font-family="Georgia, serif" font-size="76" fill="#2A2126">Soft brands,</text>
    <text x="176" y="528" font-family="Georgia, serif" font-size="76" font-style="italic" fill="#8C6F84">bold ideas.</text>
    <text x="178" y="576" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6F625C">A boutique design studio crafting identities</text>
    <text x="178" y="596" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6F625C">with warmth, intention and a little magic.</text>
    <rect x="178" y="628" width="150" height="42" rx="21" fill="#8C6F84"/>
    <text x="253" y="654" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#FBF4EC">EXPLORE WORK</text>

    <!-- hero visual -->
    <path d="M800 690 V 420 a 170 170 0 0 1 340 0 V 690 Z" fill="url(#arch)"/>
    <circle cx="970" cy="470" r="72" fill="#F7E8E2"/>
    <path d="M880 690 V 590 a 60 60 0 0 1 120 0 V 690 Z" fill="#8C6F84" opacity=".85"/>
    <circle cx="1070" cy="580" r="34" fill="none" stroke="#C0A06A" stroke-width="1.5"/>
    <text x="970" y="662" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#FBF4EC">est. 2019</text>

    <!-- lower cards -->
    <g>
      <rect x="176" y="740" width="300" height="120" rx="8" fill="#F3E5DC"/>
      <rect x="196" y="760" width="44" height="44" rx="22" fill="#D9AFAE"/>
      <text x="256" y="780" font-family="Georgia, serif" font-size="18" fill="#2A2126">Branding</text>
      <rect x="256" y="792" width="150" height="3" rx="1.5" fill="#DCCAC1"/>
      <rect x="256" y="804" width="110" height="3" rx="1.5" fill="#DCCAC1"/>
      <text x="196" y="840" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#8C6F84">01 — IDENTITY</text>
    </g>
    <g>
      <rect x="492" y="740" width="300" height="120" rx="8" fill="#EFDDD8"/>
      <rect x="512" y="760" width="44" height="44" rx="22" fill="#B08FA5"/>
      <text x="572" y="780" font-family="Georgia, serif" font-size="18" fill="#2A2126">Packaging</text>
      <rect x="572" y="792" width="150" height="3" rx="1.5" fill="#DCCAC1"/>
      <rect x="572" y="804" width="110" height="3" rx="1.5" fill="#DCCAC1"/>
      <text x="512" y="840" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#8C6F84">02 — PRODUCT</text>
    </g>
    <g>
      <rect x="808" y="740" width="300" height="120" rx="8" fill="#F6EDE3"/>
      <rect x="828" y="760" width="44" height="44" rx="22" fill="#C0A06A"/>
      <text x="888" y="780" font-family="Georgia, serif" font-size="18" fill="#2A2126">Editorial</text>
      <rect x="888" y="792" width="150" height="3" rx="1.5" fill="#DCCAC1"/>
      <rect x="888" y="804" width="110" height="3" rx="1.5" fill="#DCCAC1"/>
      <text x="828" y="840" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#8C6F84">03 — LAYOUT</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="rotate(6 1370 640)" filter="url(#shadow)">
    <rect x="1240" y="360" width="260" height="530" rx="40" fill="url(#phone)"/>
    <rect x="1254" y="374" width="232" height="502" rx="30" fill="#FBF6EF"/>
    <rect x="1320" y="386" width="100" height="10" rx="5" fill="#241C22" opacity=".9"/>
    <text x="1280" y="440" font-family="Georgia, serif" font-size="20" fill="#2A2126">creative touch</text>
    <rect x="1280" y="460" width="180" height="180" rx="10" fill="url(#arch)"/>
    <circle cx="1370" cy="520" r="42" fill="#F7E8E2"/>
    <text x="1280" y="680" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#2A2126">Soft &amp;</text>
    <text x="1280" y="714" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#8C6F84">elegant.</text>
    <rect x="1280" y="740" width="180" height="3" rx="1.5" fill="#DCCAC1"/>
    <rect x="1280" y="756" width="130" height="3" rx="1.5" fill="#DCCAC1"/>
    <rect x="1280" y="790" width="120" height="34" rx="17" fill="#2A2126"/>
    <text x="1340" y="812" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" fill="#F7EDE5">CONTACT</text>
  </g>

  <!-- cursor -->
  <g filter="url(#shadowSoft)">
    <path d="M1180 700 l 0 46 l 12 -12 l 9 20 l 10 -5 l -9 -19 l 16 -1 Z" fill="#2A2126"/>
    <rect x="1200" y="752" width="74" height="26" rx="13" fill="#8C6F84"/>
    <text x="1237" y="769" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" letter-spacing="1" fill="#FBF4EC">you</text>
  </g>

  <rect width="1600" height="1100" filter="url(#grain)" opacity=".14"/>
</svg>
