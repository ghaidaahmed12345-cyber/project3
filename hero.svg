<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Creative Touch brand moodboard artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EEE6"/>
      <stop offset=".55" stop-color="#F1E3DA"/>
      <stop offset="1" stop-color="#E8D4CC"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EACFCC"/>
      <stop offset="1" stop-color="#DDB9BA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF7"/>
      <stop offset="1" stop-color="#F7EDE2"/>
    </linearGradient>
    <radialGradient id="light" cx=".3" cy=".1" r=".9">
      <stop offset="0" stop-color="#FFFAF3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFAF3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#4A3546" flood-opacity=".2"/>
    </filter>
    <filter id="shadowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4A3546" flood-opacity=".14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#light)"/>
  <circle cx="120" cy="150" r="220" fill="#FBF3EA" opacity=".7" filter="url(#blur)"/>

  <!-- arch -->
  <path d="M150 1250 V 520 a 350 350 0 0 1 700 0 V 1250 Z" fill="url(#arch)"/>

  <!-- top labels -->
  <text x="150" y="112" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="6" fill="#8C6F84">CREATIVE TOUCH</text>
  <text x="850" y="112" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="6" fill="#8C6F84">EST. 2019</text>
  <path d="M150 134 h700" stroke="#C9B3A6" stroke-width="1" opacity=".6"/>

  <!-- abstract composition -->
  <circle cx="500" cy="540" r="205" fill="#A9869B"/>
  <circle cx="500" cy="540" r="205" fill="none" stroke="#C0A06A" stroke-width="1.2" opacity=".7"/>
  <circle cx="640" cy="470" r="105" fill="#F7E7E1"/>
  <circle cx="390" cy="640" r="120" fill="none" stroke="#FBF4EC" stroke-width="1.4" opacity=".8"/>
  <circle cx="500" cy="540" r="150" fill="none" stroke="#E4C8C6" stroke-width="1" opacity=".5"/>

  <text x="500" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="130" font-style="italic" fill="#FBF3EA">CT</text>

  <!-- botanical -->
  <g stroke="#8C6F84" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M210 780 C 240 690 240 620 220 540" stroke-width="2"/>
    <path d="M228 700 c -26 -12 -38 -34 -34 -58 c 22 4 34 26 34 58 Z" stroke-width="1.2"/>
    <path d="M222 650 c 26 -12 38 -34 34 -58 c -22 4 -34 26 -34 58 Z" stroke-width="1.2"/>
    <path d="M214 604 c -22 -10 -32 -30 -28 -50 c 18 4 28 22 28 50 Z" stroke-width="1.2"/>
  </g>

  <!-- card -->
  <g transform="rotate(-2 500 980)" filter="url(#shadow)">
    <rect x="140" y="850" width="720" height="260" rx="6" fill="url(#card)"/>
    <rect x="162" y="872" width="676" height="216" rx="3" fill="none" stroke="#DCC4AE" stroke-width=".8"/>
    <text x="200" y="938" font-family="Georgia, serif" font-size="54" fill="#2A2126">Creative Touch</text>
    <rect x="202" y="958" width="90" height="1.4" fill="#C0A06A"/>
    <text x="202" y="996" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#8C6F84">GRAPHIC DESIGNER &amp; VISUAL STORYTELLER</text>
    <text x="202" y="1048" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#A1907F">Portfolio — Selected works 2026</text>
    <g transform="translate(770 1020)">
      <circle r="34" fill="none" stroke="#D9AFAE" stroke-width="1.2"/>
      <text y="6" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#8C6F84">CT</text>
    </g>
  </g>

  <!-- swatch fan -->
  <g filter="url(#shadowSoft)" transform="translate(660 1110)">
    <g transform="rotate(-16)">
      <rect x="0" y="0" width="46" height="120" rx="7" fill="#F6E5E1"/>
    </g>
    <g transform="rotate(-8)">
      <rect x="40" y="-8" width="46" height="128" rx="7" fill="#D9AFAE"/>
    </g>
    <g>
      <rect x="80" y="-14" width="46" height="134" rx="7" fill="#B08FA5"/>
    </g>
    <g transform="rotate(8)">
      <rect x="120" y="-8" width="46" height="128" rx="7" fill="#6E5266"/>
    </g>
    <g transform="rotate(16)">
      <rect x="160" y="0" width="46" height="120" rx="7" fill="#C0A06A"/>
    </g>
  </g>

  <text x="500" y="1200" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" letter-spacing="5" fill="#A1907F">SOFT · ELEGANT · TIMELESS</text>

  <rect width="1000" height="1250" filter="url(#grain)" opacity=".15"/>
</svg>
